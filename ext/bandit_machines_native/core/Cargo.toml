[package]
name = "bandit-machines"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded UCB1 and epsilon-greedy arm selection with ticketed delayed rewards"
readme = "README.md"
exclude = ["src/**/tests.rs", "src/tests/", "tests/"]
keywords = ["bandit", "ucb1", "epsilon-greedy", "exploration", "no-std"]
categories = ["no-std", "algorithms"]

[dependencies]
sliderule-machines.workspace = true
periscope-machines.workspace = true

[dev-dependencies]
matryona-machines = { workspace = true, features = ["testing"] }

[lints]
workspace = true
